<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเข้าร่วมกิจกรรม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-indigo-600">
        
        <div class="text-center mb-6">
            <span id="badge-mandatory" class="hidden bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold border border-amber-300 mb-2 inline-block">
                ⭐ กิจกรรมบังคับ
            </span>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-800" id="display-activity">ลงชื่อเข้าร่วมกิจกรรม</h1>
            <p class="text-xs text-gray-500 mt-1">กรอกข้อมูลและแนบรูปถ่ายการทำกิจกรรม</p>
        </div>

        <form id="studentForm" action="/api/submit-entry" method="POST" enctype="multipart/form-data" class="space-y-4">
            <!-- Hidden inputs สำหรับส่งค่ากิจกรรม -->
            <input type="hidden" name="activity_name" id="activity_name">
            <input type="hidden" name="is_mandatory" id="is_mandatory">

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">รหัสประจำตัวนักเรียน *</label>
                <input type="text" name="student_id" required placeholder="เช่น 12345"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล *</label>
                <input type="text" name="fullname" required placeholder="เช่น เด็กชายรักดี มีสุข"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">ระดับชั้น *</label>
                    <input type="text" name="student_class" required placeholder="เช่น ม.1"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">ห้อง *</label>
                    <input type="text" name="student_room" required placeholder="เช่น 2"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">แนบรูปถ่ายกิจกรรม *</label>
                <input type="file" name="photo" accept="image/*" required
                    class="w-full text-xs text-gray-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-gray-300 rounded-lg cursor-pointer">
                <p class="text-[11px] text-gray-400 mt-1">💡 เลือกถ่ายภาพใหม่ หรือเลือกจากคลังภาพได้</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md text-sm mt-2">
                📤 ส่งข้อมูลเข้าร่วมกิจกรรม
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activity = urlParams.get('activity') || 'กิจกรรมทั่วไป';
        const mandatory = urlParams.get('mandatory') === 'true';

        document.getElementById('display-activity').innerText = activity;
        document.getElementById('activity_name').value = activity;
        document.getElementById('is_mandatory').value = mandatory;

        if (mandatory) {
            document.getElementById('badge-mandatory').classList.remove('hidden');
        }

        // ป้องกันการกดปุ่มส่งซ้ำ (Anti-Double Submit)
        document.getElementById('studentForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '⏳ กำลังส่งข้อมูล... กรุณารอสักครู่';
            btn.classList.add('opacity-50', 'cursor-not-allowed');
        });
    </script>
</body>
</html>
