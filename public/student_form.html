<!-- public/student_form.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกบำเพ็ญประโยชน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-4 pb-12">
    
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border-t-8 border-indigo-500 mt-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">✍️ บันทึกบำเพ็ญประโยชน์</h1>
        <p class="text-sm text-center text-gray-500 mb-8">กรอกข้อมูลเพื่อสะสมยอดกิจกรรม</p>
        
        <form action="/api/submit-entry" method="POST" class="space-y-4">
            
            <!-- ช่องรหัสนักเรียน (ตัวที่ทำให้อาจจะ error ถ้าเวอร์ชันเก่าไม่มี) -->
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">รหัสนักเรียน (เลขประจำตัว)</label>
                <input type="number" name="student_id" required placeholder="เช่น 12345"
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-300 transition border-gray-300">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">ชื่อ-นามสกุล (ด.ช./ด.ญ./นาย/นางสาว)</label>
                <input type="text" name="fullname" required placeholder="สมชาย ใจดี"
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-300 transition border-gray-300">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">ชั้น (เช่น ม.1, ป.6)</label>
                    <input type="text" name="student_class" required placeholder="ม.1"
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-300 transition border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">ห้อง (เฉพาะเลข)</label>
                    <input type="number" name="student_room" required placeholder="2"
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-300 transition border-gray-300">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md mt-4">
                ✅ ส่งข้อมูล
            </button>
        </form>
    </div>

</body>
</html>
