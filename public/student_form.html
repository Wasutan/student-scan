<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงชื่อบำเพ็ญประโยชน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-4 pb-12">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-lg border-t-8 border-indigo-500 mt-4">
        
        <div class="bg-indigo-50 p-4 rounded-lg mb-6 border border-indigo-100 text-center">
            <p class="text-xs text-indigo-500 font-semibold mb-1">กิจกรรม:</p>
            <h2 id="display_activity" class="text-xl font-bold text-indigo-900">-</h2>
            <div id="display_badge" class="hidden mt-2">
                <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold border border-amber-300">⭐ กิจกรรมบังคับ</span>
            </div>
        </div>

        <form action="/api/submit-entry" method="POST" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="activity_name" id="input_activity">
            <input type="hidden" name="is_mandatory" id="input_mandatory">

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">รหัสนักเรียน</label>
                <input type="number" name="student_id" required placeholder="เช่น 12345" class="w-full p-3 border rounded-lg border-gray-300 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" name="fullname" required placeholder="นายสมชาย ใจดี" class="w-full p-3 border rounded-lg border-gray-300 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ชั้น</label>
                    <input type="text" name="student_class" required placeholder="ม.4" class="w-full p-3 border rounded-lg border-gray-300 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">ห้อง</label>
                    <input type="number" name="student_room" required placeholder="1" class="w-full p-3 border rounded-lg border-gray-300 outline-none">
                </div>
            </div>

            <div class="p-4 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 text-center">
                <label class="block text-sm font-bold text-gray-700 mb-2">📸 อัปโหลดรูปภาพหลักฐาน</label>
                <input type="file" name="photo" accept="image/*" capture="environment" required class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md mt-6">
                ✅ ส่งข้อมูลและบันทึก
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activity = urlParams.get('activity') || 'กิจกรรมทั่วไป';
        const isMandatory = urlParams.get('mandatory') === 'true';

        document.getElementById('display_activity').textContent = activity;
        document.getElementById('input_activity').value = activity;
        document.getElementById('input_mandatory').value = isMandatory;

        if (isMandatory) {
            document.getElementById('display_badge').classList.remove('hidden');
        }
    </script>
</body>
</html>
