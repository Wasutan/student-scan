<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็กชื่อเข้ากิจกรรม (Node.js)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        #reader { width: 100%; border-radius: 0.5rem; overflow: hidden; border: 2px solid #e5e7eb; }
        #reader__dashboard_section_csr span { color: #374151 !important; }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <header class="bg-indigo-700 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-semibold">📸 ระบบเช็กชื่อกิจกรรม (บำเพ็ญประโยชน์)</h1>
            <span class="text-sm bg-indigo-500 px-3 py-1 rounded-full border border-indigo-400">Node.js Backend 🟢</span>
        </div>
    </header>

    <main class="container mx-auto mt-6 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 space-y-6">
            <!-- ตั้งค่าเกณฑ์ -->
            <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-indigo-500">
                <h2 class="text-lg font-semibold mb-4 text-indigo-700">⚙️ ตั้งค่าเกณฑ์กิจกรรม</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600">จำนวนครั้งที่จัดทั้งหมด</label>
                        <input type="number" id="totalSessions" class="mt-1 w-full p-2 border rounded focus:ring focus:ring-indigo-200">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600">เกณฑ์การผ่าน (ครั้ง)</label>
                        <input type="number" id="passCriteria" class="mt-1 w-full p-2 border rounded focus:ring focus:ring-indigo-200">
                    </div>
                    <button onclick="saveSettings()" class="w-full bg-gray-800 text-white py-2 rounded hover:bg-gray-700 transition">บันทึกเกณฑ์</button>
                </div>
            </div>

            <!-- กล้องสแกน -->
            <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-green-500 text-center">
                <h2 class="text-lg font-semibold mb-4 text-green-700">📷 สแกนรหัสนักเรียน</h2>
                <div id="reader" class="mx-auto"></div>
                <div id="scanStatus" class="mt-3 text-sm font-semibold text-gray-500">รอการสแกน...</div>
            </div>
        </div>

        <div class="md:col-span-2">
            <div class="bg-white p-5 rounded-lg shadow-md h-full">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                    <h2 class="text-lg font-semibold text-gray-700">📋 รายชื่อผู้เข้าร่วม <span id="totalCount" class="text-indigo-600">(0 คน)</span></h2>
                    <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition shadow flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        โหลด Excel (CSV)
                    </button>
                </div>

                <div class="overflow-x-auto rounded border">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-3 text-sm text-gray-600">รหัสนักเรียน</th>
                                <th class="p-3 text-sm text-gray-600">เวลาสแกนล่าสุด</th>
                                <th class="p-3 text-sm text-gray-600 text-center">เข้าร่วม (ครั้ง)</th>
                                <th class="p-3 text-sm text-gray-600 text-center">สถานะกิจกรรม</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" class="text-center p-4 text-gray-500">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // เรียก API โดยชี้ไปที่ /api ของ Node.js
        const API_URL = '/api';
        let currentSettings = { total: 10, pass: 9 };
        let studentData = {};

        async function loadData() {
            try {
                let res = await fetch(`${API_URL}/load`);
                let data = await res.json();
                
                currentSettings = data.settings;
                studentData = data.students;

                document.getElementById('totalSessions').value = currentSettings.total;
                document.getElementById('passCriteria').value = currentSettings.pass;
                
                renderTable();
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        async function saveSettings() {
            let total = document.getElementById('totalSessions').value;
            let pass = document.getElementById('passCriteria').value;
            
            await fetch(`${API_URL}/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ total, pass })
            });
            
            Swal.fire('สำเร็จ!', 'บันทึกเกณฑ์กิจกรรมแล้ว', 'success');
            loadData();
        }

        function renderTable() {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            let students = Object.values(studentData);
            
            document.getElementById('totalCount').innerText = `(${students.length} คน)`;

            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">ยังไม่มีข้อมูลการสแกน</td></tr>`;
                return;
            }

            students.sort((a, b) => {
                let dateA = a.last_scan.split('/').reverse().join('') + a.last_scan; 
                let dateB = b.last_scan.split('/').reverse().join('') + b.last_scan;
                return dateB.localeCompare(dateA);
            });

            students.forEach(s => {
                let isPassed = s.count >= currentSettings.pass;
                let statusHtml = isPassed 
                    ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold">✅ ผ่าน</span>` 
                    : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-semibold">❌ ไม่ผ่าน (${s.count}/${currentSettings.pass})</span>`;

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-3 text-sm font-semibold text-gray-800">${s.id}</td>
                        <td class="p-3 text-sm text-gray-500">${s.last_scan}</td>
                        <td class="p-3 text-sm font-bold text-center text-indigo-600 text-lg">${s.count}</td>
                        <td class="p-3 text-sm text-center">${statusHtml}</td>
                    </tr>
                `;
            });
        }

        let scanCooldown = false;
        async function onScanSuccess(decodedText) {
            let studentId = decodedText.trim();
            if (scanCooldown) return;

            scanCooldown = true;
            document.getElementById('scanStatus').innerHTML = `<span class="text-indigo-600 font-bold">กำลังบันทึกรหัส: ${studentId}...</span>`;

            try {
                let res = await fetch(`${API_URL}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: studentId })
                });
                
                let result = await res.json();
                if(result.status === 'success') {
                    Swal.fire({
                        title: `บันทึกรหัส ${studentId}`,
                        text: `เข้ากิจกรรมครั้งที่ ${result.data.count}`,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    loadData();
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            }

            setTimeout(() => { 
                scanCooldown = false; 
                document.getElementById('scanStatus').innerText = "พร้อมสแกนคิวต่อไป...";
            }, 2000);
        }

        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "รหัสนักเรียน,เวลาสแกนล่าสุด,เข้าร่วม(ครั้ง),เกณฑ์,สถานะ\r\n";
            
            Object.values(studentData).forEach(s => {
                let status = s.count >= currentSettings.pass ? "ผ่าน" : "ไม่ผ่าน";
                csvContent += `="${s.id}",${s.last_scan},${s.count},${currentSettings.pass},${status}\r\n`;
            });

            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "รายงานกิจกรรม.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = () => {
            loadData();
            let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            scanner.render(onScanSuccess, (err) => {});
        };
    </script>
</body>
</html>
